# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Sum of sets in several dimensions"
  description: >-
    Lean 4 formalization of Ruzsa's lower bound for sumsets in ℝ^D: if A and B are finite
    sets with B nonempty and |B| ≤ |A|, and A + B has affine dimension d, then
    |A + B| ≥ |A| + Σ_{t=1}^{|B|-1} min(d, |A| - t). For d ≥ 1 and |A| ≥ d + 1
    the bound is attained in ℝ^d. The closed form
    |A + B| ≥ |A| + d|B| - d(d+1)/2, the asymmetric form of Freiman's lemma, is derived from
    the bound, and so is the bound 2κ - 1, for a real κ, on the Freiman dimension of a set X
    with |X + X| ≤ κ|X|.
  authors:
    - "Gabriel Dahia"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Gabriel Dahia"

classification:
  arxiv: ["math.CO", "math.NT"]
  msc2020: ["11P70", "11B13", "11B75"]

sources:
  - title: "Sum of sets in several dimensions"
    authors:
      - "Imre Z. Ruzsa"
    id: "https://doi.org/10.1007/BF01302969"
    type: "paper"
    location: "https://doi.org/10.1007/BF01302969"
    relationship: "formalizes"
    note: >-
      Combinatorica 14 (1994), no. 4, 485–490. Theorem 1, Corollary 1.1, Lemma 2.1, the
      formulas (1.5), (1.6) and (1.7) for G_d(m, n), and Theorem 2 with the construction of
      Section 3. See fidelity.divergences.
    license: "unknown"
    author_endorsement: "not-contacted"

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4"
    relationship: "builds-on"
    note: >-
      Mathlib has the pointwise sum and difference of sets, Submodule.span, Module.finrank,
      affineSpan and vectorSpan, Freiman isomorphisms and the lexicographic order on
      Fin D → ℝ. It has no affine dimension of a finite set, no Freiman dimension, and none of
      the results of the paper.

status:
  scope: >-
    Theorem 1, Corollary 1.1, Lemma 2.1, the formulas (1.5) to (1.7) and Theorem 2 of the
    paper, for finite subsets of Fin D → ℝ, and lemmas on the affine dimension of a finite
    set: its expression as the rank of the vector span, monotonicity, invariance under
    translation, and bounds for the dimension of a sumset by those of the summands and of the
    union. The library also defines the Freiman dimension of a finite subset of a
    commutative monoid, deduces Theorem 1 for sets with a Freiman model in ℝ^r and for sets of
    given Freiman dimension, and bounds r, and the Freiman dimension of X, by 2κ - 1 when
    |X + X| ≤ κ|X|. The sorry counts refer to the library and Solution.lean; Challenge.lean has
    one placeholder for each of its six statements.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5"]
      framework: "Claude Code"
      tool_setup: "Lean 4, Mathlib, shell."
      cost:
        wall_time: "three sessions"
        spend_usd: "not tracked"
        hardware: "local machine"
      prompting_notes: >-
        A first instruction to formalize Ruzsa's theorem, with the closed form and the lemmas
        that relate the affine dimension to the vector span. Later instructions to restyle
        the statements and proofs after Gabriel Dahia's review of other repositories, to
        bring back the Freiman dimension, to formalize the remaining results of the paper
        from a copy of it, and to state the Freiman dimension results in Challenge.lean with
        a real κ.
    - method: "agent"
      models: ["gpt-5.6 sol high", "claude opus 5"]
      framework: "Codex"
      tool_setup: >-
        Codex agents guided by an AGENTS.md, with Lean proofs checked in a pinned Lake
        environment.
  spend_usd: "not tracked"
  notes: >-
    The first proof of Theorem 1 and the Freiman dimension were written by Codex agents.
    Claude Code, directed by Gabriel Dahia, assembled this repository, rewrote those
    proofs, and wrote the remaining statements and proofs, Challenge.lean, Solution.lean
    and this file. The solution theorems use only propext, Classical.choice and Quot.sound.

fidelity:
  divergences: >-
    Theorem 1 and Corollary 1.1 are stated as bounds for the sets themselves rather than for
    the minimum F_d(m, n). The sets lie in Fin D → ℝ for an arbitrary D, and d is the affine
    dimension of A + B, so d < D is allowed. The set B is assumed nonempty instead of
    m + n ≥ d + 2. Corollary 1.1 is stated for every d at most the affine dimension of A + B.

    The proof of Theorem 1 uses the lexicographic order on Fin D → ℝ in place of a linear
    functional that separates the points of A ∪ B.

    Formula (1.5) is proved for n - m ≥ d - 1, and the paper states it for n - m ≥ d.
    Formulas (1.6) and (1.7) are stated multiplied by two, without division.

    Theorem 2 does not exclude the pairs with m ≤ n - m ≤ d, which the paper does: the
    construction of Section 3 attains G_d(m, n) for them too. In that construction, for
    n - m < d, the paper lists the sums e_i + e_j with 2 ≤ i, j ≤ k and counts k(k - 1)/2 of
    them, but the sums with i ≤ k < j occur as well; the final value G_d(m, n) is correct and
    is the one proved here. The set A is {0, e₁, …, (m - k) e₁} ∪ {e₂, …, e_k} with
    k = max(1, d - (n - m)), which for n - m ≥ d is the set {0, …, (m - 1) e₁} of the paper.

review:
  status: "self-assessed"
  reviewers: ["Gabriel Dahia"]
  notes: >-
    Gabriel Dahia read the statements and proofs and checked them for mathematical correctness
    and style.

alignment:
  namespace: "SumOfSetsInSeveralDimensions"
  statements:
    - source: "Theorem 1"
      lean: "SumOfSetsInSeveralDimensions.card_add_sum_min_le_card_add_of_finrank_span_sub_eq'"
      module: "Challenge"
      status: "proved"
      note: "With |B| ≤ |A| and d the rank of the span of the differences of A + B."
    - source: "Corollary 1.1"
      lean: "SumOfSetsInSeveralDimensions.card_add_mul_card_le_card_add_add_of_le_finrank_span_sub'"
      module: "Challenge"
      status: "proved"
      note: "For every d at most the rank of the span of the differences of A + B."
    - source: "Theorem 2, F_d(m, n) = G_d(m, n)"
      lean: "SumOfSetsInSeveralDimensions.sInf_card_add_eq_add_sum_min'"
      module: "Challenge"
      status: "proved"
      note: "For d ≥ 1, 1 ≤ m ≤ n and n ≥ d + 1."
    - source: "Theorem 2, F'_d(m, n) = G_d(m, n)"
      lean: "SumOfSetsInSeveralDimensions.sInf_card_add_of_finrank_span_sub_right_eq_add_sum_min'"
      module: "Challenge"
      status: "proved"
      note: "For d ≥ 1, 1 ≤ m ≤ n and n ≥ d + 1."
    - source: "Theorem 1, library form"
      lean: "SumOfSetsInSeveralDimensions.card_add_sum_min_le_card_add"
      module: "SumOfSetsInSeveralDimensions.LowerBound"
      status: "proved"
      note: "With d = (A + B).affineDim."
    - source: "Corollary 1.1, library form"
      lean: "SumOfSetsInSeveralDimensions.card_add_mul_card_le_card_add_add"
      module: "SumOfSetsInSeveralDimensions.ClosedForm"
      status: "proved"
      note: "With d ≤ (A + B).affineDim."
    - source: "Lemma 2.1"
      lean: "SumOfSetsInSeveralDimensions.geometric_deletion_cases"
      module: "SumOfSetsInSeveralDimensions.GeometricDeletion"
      status: "proved"
      note: "For sets that contain 0 and whose other points are lexicographically positive."
    - source: "Formula (1.5)"
      lean: "SumOfSetsInSeveralDimensions.sumsetCardLowerBound_of_add_le"
      module: "SumOfSetsInSeveralDimensions.LowerBoundValues"
      status: "proved"
    - source: "Formula (1.6)"
      lean: "SumOfSetsInSeveralDimensions.two_mul_sumsetCardLowerBound_add_add"
      module: "SumOfSetsInSeveralDimensions.LowerBoundValues"
      status: "proved"
      note: "The first expression of (1.6) is two_mul_sumsetCardLowerBound_add."
    - source: "Formula (1.7)"
      lean: "SumOfSetsInSeveralDimensions.two_mul_sumsetCardLowerBound_of_le"
      module: "SumOfSetsInSeveralDimensions.LowerBoundValues"
      status: "proved"
    - source: "Section 3"
      lean: "SumOfSetsInSeveralDimensions.exists_card_add_eq_sumsetCardLowerBound"
      module: "SumOfSetsInSeveralDimensions.Construction"
      status: "proved"
    - source: "Theorem 2, library form"
      lean: "SumOfSetsInSeveralDimensions.minCardAdd_eq_sumsetCardLowerBound"
      module: "SumOfSetsInSeveralDimensions.MinCardAdd"
      status: "proved"
      note: "minCardAddOfDimRight_eq_sumsetCardLowerBound is the statement for F'_d."
    - source: "Not in the paper: Theorem 1 for Freiman models"
      lean: "SumOfSetsInSeveralDimensions.card_add_sum_min_le_card_add_of_isAddFreimanIso_of_finrank_span_sub_eq'"
      module: "Challenge"
      status: "proved"
      note: >-
        For finite A, B in a commutative monoid with a Freiman model of A ∪ B in ℝ^r, with
        r - 1 in place of d.
    - source: "Not in the paper: the bound 2κ - 1 for Freiman models"
      lean: "SumOfSetsInSeveralDimensions.le_two_mul_sub_one_of_isAddFreimanIso_of_finrank_span_sub_eq'"
      module: "Challenge"
      status: "proved"
      note: >-
        For a nonempty X in a cancellative commutative monoid with |X + X| ≤ κ|X|, κ real, and
        a Freiman model of X in ℝ^r.
    - source: "Not in the paper: Theorem 1 for sets of given Freiman dimension"
      lean: "SumOfSetsInSeveralDimensions.card_add_sum_min_le_of_freimanDim_union"
      module: "SumOfSetsInSeveralDimensions.FreimanDimensionSumsetBounds"
      status: "proved"
      note: "With r = freimanDim (A ∪ B) ≥ 1."
    - source: "Not in the paper: the Freiman dimension is at most 2κ - 1"
      lean: "SumOfSetsInSeveralDimensions.freimanDim_le_two_mul_sub_one_of_card_add_le"
      module: "SumOfSetsInSeveralDimensions.FreimanDimensionSumsetBounds"
      status: "proved"
      note: "For a nonempty X in a cancellative commutative monoid and a real κ."

acknowledgements: "Lean 4 and Mathlib; the Palomar registry template."
